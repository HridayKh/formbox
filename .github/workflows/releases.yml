name: Build, Version, and Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  DEFAULT_BASE_VERSION: "0.1.0"   # used if no tags exist yet

jobs:
  build:
    runs-on: ubuntu-latest
    environment: actions
    outputs:
      version: ${{ steps.version.outputs.version }}
      versiondev: ${{ steps.version.outputs.versiondev }}
      bump: ${{ steps.parse.outputs.bump }}
      deploy: ${{ steps.parse.outputs.deploy }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout (full history, needed for tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          # No `cache: gradle` here — gradle/actions/setup-gradle below provides
          # more sophisticated caching and shouldn't be combined with this option.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Enhanced caching is on by default. Switch to `basic` if you need a
          # 100% MIT-licensed provider instead.
          cache-provider: enhanced
          # Only write cache entries from pushes to main (the default branch);
          # this repo already only triggers on `push: branches: [ main ]`,
          # so every run here writes to the cache.
          cache-read-only: false
          # Purge unused Gradle User Home content when the build succeeds,
          # keeping cache entries small.
          cache-cleanup: on-success
          # Fail fast on a tampered/invalid Gradle wrapper jar.
          validate-wrappers: true

      - name: Parse commit message for keywords
        id: parse
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"

          BUMP="none"
          if echo "$MSG" | grep -q "#major"; then
            BUMP="major"
          elif echo "$MSG" | grep -q "#minor"; then
            BUMP="minor"
          elif echo "$MSG" | grep -q "#patch"; then
            BUMP="patch"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          HAS_DEPLOY="false"
          if echo "$MSG" | grep -q "#deploy"; then
            HAS_DEPLOY="true"
          fi

          HAS_DEPLOY_FORCE="false"
          if echo "$MSG" | grep -q "#deploy-force"; then
            HAS_DEPLOY_FORCE="true"
          fi

          # Deploy only if: (bump is minor/major AND #deploy present) OR #deploy-force present
          DEPLOY="false"
          if [ "$HAS_DEPLOY_FORCE" = "true" ]; then
            DEPLOY="true"
          elif [ "$HAS_DEPLOY" = "true" ] && { [ "$BUMP" = "minor" ] || [ "$BUMP" = "major" ]; }; then
            DEPLOY="true"
          fi
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version

        run: |
          BUMP="${{ steps.parse.outputs.bump }}"
          RUN_NUMBER="${{ github.run_number }}"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            BASE="${DEFAULT_BASE_VERSION}"
          else
            BASE="${LAST_TAG#v}"
          fi

          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}+${RUN_NUMBER}"
          VERSIONDEV="${MAJOR}.${MINOR}.$((PATCH + 1))-dev+${RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versiondev=$VERSIONDEV" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"
          echo "Computed versiondev: $VERSIONDEV"


      - name: Build and test
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: ./gradlew build --build-cache -Pversion="${{ steps.version.outputs.version }}" --scan

      - name: Sync version into build.gradle.kts
        run: |
          VERSIONDEV="${{ steps.version.outputs.versiondev }}"
          sed -i "s/^version = \".*\"/version = \"$VERSIONDEV\"/" build.gradle.kts

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet build.gradle.kts; then
            git add build.gradle.kts
            git commit -m "chore: sync version to $VERSION [skip ci]"
            git push origin HEAD:main
          else
            echo "No version change to commit"
          fi

      - name: Upload JAR artifact
        if: steps.parse.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

      - name: Create and push tag
        if: steps.parse.outputs.bump != 'none'
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (build ${{ github.run_number }})"
          git push origin "$TAG"

      - name: Create Sentry release
        if: steps.parse.outputs.bump != 'none'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          version: ${{ steps.version.outputs.version }}
          set_commits: auto

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: actions
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: ./dist

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rename JAR to a predictable filename
        run: |
          JAR_FILE=$(ls ./dist/*.jar | grep -v -- '-plain' | head -n 1)
          cp "$JAR_FILE" ./dist/app.jar

      - name: SCP JAR to server
        run: |
          scp -i ~/.ssh/deploy_key \
            ./dist/app.jar \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/opc/formbox/new/app.jar"

      - name: Run remote deploy script
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash /home/opc/formbox/deploy.sh ${{ needs.build.outputs.version }}"

      - name: Notify Sentry of deploy
        if: needs.build.outputs.bump != 'none'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          version: ${{ needs.build.outputs.version }}
          environment: prod